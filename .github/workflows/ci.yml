name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync
      - run: make lint
      - run: make test
