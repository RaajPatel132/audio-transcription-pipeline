[project]
name = "audio-transcription-pipeline"
version = "0.1.0"
description = "Turns audio files into timestamped transcripts (JSON, SRT, WebVTT, text)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2,<2",
    "numpy>=2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.scripts]
transcribe = "transcription.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "T20"]

[tool.mypy]
files = ["src", "tests", "scripts"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs the real model; run with `make test-integration`"]
